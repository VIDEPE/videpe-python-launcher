name: CI
on:
  pull_request:
    types: [edited, opened, synchronize, reopened]
  push:
    branches:
      - main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # read the PR title
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # One type per line: the action reads a comma-separated list as a single type
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
            deps
          requireScope: false

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.15"
          enable-cache: true
      - name: Pin Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }} && uv python pin ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run ty check
      - name: Test
        run: uv run pytest -n auto tests
      - name: Coverage
        run: uv run coverage run -m pytest tests && uv run coverage report
      - name: Audit dependencies
        run: uv audit
      - name: Audit workflows
        run: uvx zizmor .github/workflows/
